[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pubdeploy"
version = "0.5.1"
description = "The deploy walk: what a service needs before it deploys, whether it has it, and making it; and the checks a deploy to Kubernetes runs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "David Schryer", email = "schryer@gmail.com" }]
# PyYAML reads the manifests kustomize renders. k8s.py, which a server runs
# as a file, needs it only for YAML.
# python-statemachine runs a unit's machine (machine.load), pinned by its wheel's address and
# sha256 as every other dependency of the walk's is in the lock.
dependencies = [
    "PyYAML>=6",
    "python-statemachine @ https://files.pythonhosted.org/packages/85/d1/d722672f4bfbe1176588157e0f9fa6dd5331a71922bed36aca0e79271535/python_statemachine-3.2.2-py3-none-any.whl#sha256=141d20e00776815692e424d3df825b1bd7ccaeedc6fda7787ddf249e767e1676",
]

[project.urls]
Repository = "https://github.com/Sustenaut/pubdeploy"

[project.scripts]
pubdeploy = "pubdeploy.cli:main"

# What pubrules calls of pubdeploy (hooks.py): its sync --check and its bump.
[project.entry-points."sustenaut.sync"]
pubdeploy = "pubdeploy.hooks:check"

[project.entry-points."sustenaut.bump"]
pubdeploy = "pubdeploy.hooks:bump"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pubdeploy = [
    "schema.json",
    "journal.json",
    # The commit of the release's tag, which wheel.yml writes before it
    # builds the wheel; a source tree has none (config.release_commit).
    "release-commit",
]

# `make functional` measures the suite, the `pubdeploy` processes it starts
# included, into coverage/coverage.xml for SonarQube Cloud.
[tool.coverage.run]
source = ["pubdeploy"]
patch = ["subprocess", "execv"]
parallel = true

[tool.coverage.xml]
output = "coverage/coverage.xml"
