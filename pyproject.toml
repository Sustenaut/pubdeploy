[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pubdeploy"
version = "0.8.1"
description = "The deploy walk: what a service needs before it deploys, whether it has it, and making it; and the checks a deploy to Kubernetes runs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "David Schryer", email = "schryer@gmail.com" }]
# PyYAML reads the manifests kustomize renders. k8s.py, which a server runs
# as a file, needs it only for YAML.
# python-statemachine runs a unit's machine (machine.load). A floor, as every
# library's requirement is: PyPI takes no dependency by URL, and the exact
# version and its hashes are each consumer's lock's to pin.
dependencies = [
    "PyYAML>=6",
    "python-statemachine>=3.2.2",
]

[project.urls]
Repository = "https://github.com/Sustenaut/pubdeploy"

[project.scripts]
pubdeploy = "pubdeploy.cli:main"

# What pubrules calls of pubdeploy (hooks.py): its sync --check and its bump.
[project.entry-points."sustenaut.sync"]
pubdeploy = "pubdeploy.hooks:check"

[project.entry-points."sustenaut.bump"]
pubdeploy = "pubdeploy.hooks:bump"

# The deploy walk's test harness, for a suite that sets pubdeploy_testing = true
# in its pytest.ini (pubdeploy/testing/__init__.py); it loads nothing otherwise.
[project.entry-points.pytest11]
"pubdeploy.testing" = "pubdeploy.testing.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pubdeploy = [
    "schema.json",
    "journal.json",
    # The commit of the release's tag, which wheel.yml writes before it
    # builds the wheel; a source tree has none (config.release_commit).
    "release-commit",
]
# The sample service pubdeploy.testing's world walks; a glob skips the dot directory.
"pubdeploy.testing" = [
    "fixtures/deploy-app/*",
    "fixtures/deploy-app/**/*",
    "fixtures/deploy-app/.github/workflows/*",
]

# `make functional` measures the suite, the `pubdeploy` processes it starts
# included, into coverage/coverage.xml for SonarQube Cloud.
[tool.coverage.run]
source = ["pubdeploy"]
patch = ["subprocess", "execv"]
parallel = true

[tool.coverage.xml]
output = "coverage/coverage.xml"
